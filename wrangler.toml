name = "apptly-website"
main = ".output/server/index.mjs"
compatibility_date = "2026-04-20"
compatibility_flags = ["nodejs_compat"]

# Expose the Worker on *.workers.dev for smoke tests.
workers_dev = true

# Generate a unique preview URL for every deployment.
preview_urls = true

# TAISTAMP_SECRET signs taistamp responses. Bind as a
# script-level secret via `wrangler secret put` or the
# Workers Builds dashboard (secret-typed build variable);
# once at script level it flows into every uploaded
# version. Local dev reads it from .dev.vars.

[build]
command = "pnpm build"

[dev]
ip = "0.0.0.0"

[assets]
directory = ".output/public"
binding = "ASSETS"

# wrangler d1 create apptly-website-content
[[d1_databases]]
binding = "DB"
database_name = "apptly-website-content"
database_id = "827f6d7b-4b07-4986-ba61-2fd84a17717a"
preview_database_id = "local"
